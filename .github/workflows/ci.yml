name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref; a newer push supersedes an in-flight one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Each OS builds its own toolkit crate (AppKit, GTK 4, Win32) and runs the
    # whole workspace's tests, the shared UI's included.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # GTK 4 for wtm-gtk, WebKitGTK for the Tauri app's webview.
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkit2gtk-4.1-dev xvfb

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

      # GTK's tests open windows, which need a display.
      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace

      # The end-to-end test drives real git, so a release build is the only
      # thing left unproven — and on macOS it is what the release workflow
      # ships.
      - name: Build
        run: cargo build --release --workspace

      # `cargo test -p wtm-tauri` writes the TypeScript for the bridge's
      # types; the committed copy must be what the Rust says.
      - name: TypeScript bindings are current
        if: runner.os == 'Linux'
        run: git diff --exit-code -- ui/src/wire

  # The Tauri app's frontend: types, tests and a production build.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ui/package.json
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
