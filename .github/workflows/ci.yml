name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref; a newer push supersedes an in-flight one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest # tests are pure parsers + happy-dom, so no macOS runner needed
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version read from packageManager field

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
