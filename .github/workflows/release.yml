name: Release

on:
  push:
    branches: [main]
  # Re-run the release without inventing a commit. A run that failed on
  # credentials rather than on code has nothing to fix in the tree, and the
  # only other way back to a green release is a push to main.
  workflow_dispatch:

permissions:
  contents: write

# Only one release build at a time; a newer push supersedes an in-flight one.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is derived from main's commit count

      - uses: pnpm/action-setup@v6 # version read from packageManager field

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # The in-app updater decides there is something to install by comparing
      # semver, so every release needs a version that is both new and larger
      # than the one before. main's commit count is exactly that: it only grows,
      # and re-running this workflow on the same commit stamps the same version,
      # so a rebuild is never mistaken for an update. The tree keeps 1.0.0 —
      # nothing is committed back — and dev builds do not update themselves.
      - name: Stamp the build version
        run: |
          # workflow_dispatch offers every branch, and this job replaces the
          # release installed copies update from. Building anything but main
          # would publish that branch's code as `latest` *and* stamp it with a
          # version main might not reach for several pushes — which would freeze
          # the feed until it caught up. Fail before anything is signed.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::the release can only be built from main (got $GITHUB_REF)"
            exit 1
          fi
          VERSION="1.0.$(git rev-list --count HEAD)"
          npm pkg set version="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      # notarytool wants the App Store Connect key as a file, so the secret has
      # to land on disk. RUNNER_TEMP dies with the runner, and the last step
      # removes it regardless of how the job ends.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_API_KEY_P8 is not set"
            exit 1
          fi
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"

      # The certificate is imported here rather than by electron-builder,
      # because the way electron-builder does it is wrong: it hands
      # `security set-key-partition-list` the .p12 password, where the
      # keychain's own password belongs. macOS 26 rejects that outright
      # (SecKeychainUnlock), and the runners are macos-26. Given no CSC_LINK,
      # electron-builder skips its own keychain handling and searches
      # CSC_KEYCHAIN instead — which is the one built here.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is not set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          certificate="$RUNNER_TEMP/certificate.p12"

          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "::error::the certificate holds no Developer ID Application identity — wrong export?"
            exit 1
          fi

      # Hardened runtime is on, and electron-builder's default entitlements
      # cover what Electron needs. Notarisation of the .app happens here, from
      # the key written above.
      - name: Build and package
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: pnpm dist

      # The step above notarises the .app; the disk image around it carries no
      # ticket of its own, so Gatekeeper has to phone home the first time
      # someone mounts it — and refuses if they are offline. One more
      # submission and a staple makes the DMG self-contained.
      - name: Notarise and staple the disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected exactly one DMG in release/, found ${#dmgs[@]}"
            exit 1
          fi
          xcrun notarytool submit "${dmgs[0]}" \
            --key "$RUNNER_TEMP/apple-api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"

      # What a downloader's Mac will check, checked here instead.
      - name: Verify the signature and the tickets
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -ne 1 ] || [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected one app and one DMG, found ${#apps[@]} and ${#dmgs[@]}"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${apps[0]}"

          signature=$(codesign --display --verbose=4 "${apps[0]}" 2>&1)
          echo "$signature" | grep -E "Authority|TeamIdentifier|flags="
          if ! echo "$signature" | grep -q "Authority=Developer ID Application"; then
            echo "::error::not signed with a Developer ID Application certificate"
            exit 1
          fi
          if ! echo "$signature" | grep -q "flags=.*runtime"; then
            echo "::error::hardened runtime is not enabled"
            exit 1
          fi

          # For the DMG this is the whole check available: spctl wants a
          # signature on the disk image, and electron-builder leaves disk images
          # unsigned on purpose, so asking spctl about one only ever gets back
          # "no usable signature", ticket or no ticket.
          xcrun stapler validate "${apps[0]}"
          xcrun stapler validate "${dmgs[0]}"

          # What Gatekeeper actually does when someone runs the app they dragged
          # out of that disk image.
          assessment=$(spctl --assess --type exec -vv "${apps[0]}" 2>&1)
          echo "$assessment"
          if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Gatekeeper does not see a notarised Developer ID app"
            exit 1
          fi

      # What the in-app updater reads. electron-builder writes latest-mac.yml
      # because electron-builder.yml carries a publish config; without it the
      # release would look fine and no installed copy would ever update.
      #
      # Only the zip is checked: it is the file the updater downloads and
      # verifies (Squirrel.Mac cannot install from a DMG). The DMG's entry in
      # the same file records its hash from *before* the step above stapled a
      # notarisation ticket to it, so it no longer matches the uploaded disk
      # image — nothing reads it, and re-hashing there would mean rewriting
      # electron-builder's metadata by hand.
      - name: Verify the update metadata
        run: |
          metadata=release/latest-mac.yml
          if [ ! -f "$metadata" ]; then
            echo "::error::no $metadata — the app updater has nothing to read"
            exit 1
          fi
          cat "$metadata"

          version=$(sed -n 's/^version: //p' "$metadata" | tr -d "'\"")
          if [ "$version" != "$VERSION" ]; then
            echo "::error::update metadata says $version, this build is $VERSION"
            exit 1
          fi

          zip=$(sed -n 's/^path: //p' "$metadata" | tr -d "'\"")
          if [ ! -f "release/$zip" ]; then
            echo "::error::update metadata points at release/$zip, which was not built"
            exit 1
          fi

          # electron-updater refuses a download whose sha512 disagrees, so a
          # mismatch here is a release that silently never updates anyone.
          expected=$(sed -n 's/^sha512: //p' "$metadata" | tr -d "'\"")
          actual=$(openssl dgst -sha512 -binary "release/$zip" | openssl base64 -A)
          if [ "$expected" != "$actual" ]; then
            echo "::error::sha512 in $metadata does not match release/$zip"
            exit 1
          fi

          # Not fatal — it only costs bandwidth. Squirrel fetches just the
          # changed blocks when the blockmap sits beside the zip, and falls back
          # to the whole ~150 MB when it doesn't.
          if [ ! -f "release/$zip.blockmap" ]; then
            echo "::warning::no release/$zip.blockmap — updates will be full downloads"
          fi

      # The DMG is what a person downloads; the zip, its blockmap and
      # latest-mac.yml are what installed copies update from, and they have to
      # live in the same release for electron-updater to resolve them.
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          SHORT_SHA=${GITHUB_SHA:0:7}
          assets=(release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml)
          # Recreate the rolling release so its tag always points at this commit.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "Worktree Manager v${VERSION} (${SHORT_SHA})" \
            --notes "Automated build of \`${GITHUB_SHA}\` from \`main\`. Signed and notarised macOS arm64 build — double-click to open. Installed copies update themselves from here." \
            "${assets[@]}"

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple-api-key.p8" "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
