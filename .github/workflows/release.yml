name: Release

on:
  push:
    branches: [main]
  # Re-run the release without inventing a commit. A run that failed on
  # credentials rather than on code has nothing to fix in the tree, and the
  # only other way back to a green release is a push to main.
  workflow_dispatch:

permissions:
  contents: write

# Only one release build at a time; a newer push supersedes an in-flight one.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version read from packageManager field

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # notarytool wants the App Store Connect key as a file, so the secret has
      # to land on disk. RUNNER_TEMP dies with the runner, and the last step
      # removes it regardless of how the job ends.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_API_KEY_P8 is not set"
            exit 1
          fi
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"

      # The certificate is imported here rather than by electron-builder,
      # because the way electron-builder does it is wrong: it hands
      # `security set-key-partition-list` the .p12 password, where the
      # keychain's own password belongs. macOS 26 rejects that outright
      # (SecKeychainUnlock), and the runners are macos-26. Given no CSC_LINK,
      # electron-builder skips its own keychain handling and searches
      # CSC_KEYCHAIN instead — which is the one built here.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is not set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          certificate="$RUNNER_TEMP/certificate.p12"

          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "::error::the certificate holds no Developer ID Application identity — wrong export?"
            exit 1
          fi

      # Hardened runtime is on, and electron-builder's default entitlements
      # cover what Electron needs. Notarisation of the .app happens here, from
      # the key written above.
      - name: Build and package
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: pnpm dist

      # The step above notarises the .app; the disk image around it carries no
      # ticket of its own, so Gatekeeper has to phone home the first time
      # someone mounts it — and refuses if they are offline. One more
      # submission and a staple makes the DMG self-contained.
      - name: Notarise and staple the disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected exactly one DMG in release/, found ${#dmgs[@]}"
            exit 1
          fi
          xcrun notarytool submit "${dmgs[0]}" \
            --key "$RUNNER_TEMP/apple-api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "${dmgs[0]}"

      # What a downloader's Mac will check, checked here instead.
      - name: Verify the signature and the tickets
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -ne 1 ] || [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error::expected one app and one DMG, found ${#apps[@]} and ${#dmgs[@]}"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${apps[0]}"

          signature=$(codesign --display --verbose=4 "${apps[0]}" 2>&1)
          echo "$signature" | grep -E "Authority|TeamIdentifier|flags="
          if ! echo "$signature" | grep -q "Authority=Developer ID Application"; then
            echo "::error::not signed with a Developer ID Application certificate"
            exit 1
          fi
          if ! echo "$signature" | grep -q "flags=.*runtime"; then
            echo "::error::hardened runtime is not enabled"
            exit 1
          fi

          # For the DMG this is the whole check available: spctl wants a
          # signature on the disk image, and electron-builder leaves disk images
          # unsigned on purpose, so asking spctl about one only ever gets back
          # "no usable signature", ticket or no ticket.
          xcrun stapler validate "${apps[0]}"
          xcrun stapler validate "${dmgs[0]}"

          # What Gatekeeper actually does when someone runs the app they dragged
          # out of that disk image.
          assessment=$(spctl --assess --type exec -vv "${apps[0]}" 2>&1)
          echo "$assessment"
          if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Gatekeeper does not see a notarised Developer ID app"
            exit 1
          fi

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA:0:7}
          # Recreate the rolling release so its tag always points at this commit.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --title "Worktree Manager v${VERSION} (${SHORT_SHA})" \
            --notes "Automated build of \`${GITHUB_SHA}\` from \`main\`. Signed and notarised macOS arm64 build — double-click to open." \
            release/*.dmg

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple-api-key.p8" "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
