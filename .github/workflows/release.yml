name: Release

on:
  push:
    branches: [main]
    # A beta: the same signed, notarised build, published as a prerelease under
    # the `beta` tag instead of replacing what everyone else is running. Move
    # the tag and push it to cut one (`git push --force origin HEAD:refs/tags/beta`).
    tags: [beta]
  # Re-run a release without inventing a commit. A run that failed on
  # credentials rather than on code has nothing to fix in the tree, and the
  # only other way back to a green release is a push to main.
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to publish
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: write

# One release build at a time per channel; a newer push supersedes an
# in-flight one, but a beta never cancels the release everyone is waiting on.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: Worktree Manager

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is derived from the commit count

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-cargo-${{ runner.os }}-

      # The in-app updater decides there is something to install by comparing
      # versions, so every release needs one that is both new and larger than
      # the one before. The commit count is exactly that: it only grows, and
      # re-running this workflow on the same commit stamps the same version, so
      # a rebuild is never mistaken for an update. Nothing is committed back —
      # the tree keeps 0.1.0, and dev builds never update themselves.
      #
      # A beta adds the run number, so it sorts above the stable build of the
      # same commit and below the next one, and so that rebuilding a beta from
      # an unchanged tree *is* an update — which is what makes the update path
      # testable without inventing commits.
      - name: Work out the channel and the version
        run: |
          CHANNEL="${{ inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            case "$GITHUB_REF" in
              refs/heads/main) CHANNEL=stable ;;
              refs/tags/beta) CHANNEL=beta ;;
              *) echo "::error::nothing to release from $GITHUB_REF"; exit 1 ;;
            esac
          fi
          COMMITS=$(git rev-list --count HEAD)
          if [ "$CHANNEL" = stable ]; then
            # workflow_dispatch offers every branch, and a stable release
            # replaces the one installed copies update from. Building anything
            # but main would publish that branch's code as `latest` *and* stamp
            # it with a version main might not reach for several pushes — which
            # would freeze the feed until it caught up. Fail before anything is
            # signed.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::a stable release can only be built from main (got $GITHUB_REF)"
              exit 1
            fi
            VERSION="1.0.$COMMITS"
            BUILD="$VERSION"
            TAG=latest
          else
            VERSION="1.0.$COMMITS-beta.$GITHUB_RUN_NUMBER"
            # CFBundleVersion is meant to be digits and dots only.
            BUILD="1.0.$COMMITS.$GITHUB_RUN_NUMBER"
            TAG=beta
          fi
          {
            echo "CHANNEL=$CHANNEL"
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "TAG=$TAG"
          } >> "$GITHUB_ENV"
          echo "Building $CHANNEL version $VERSION (bundle version $BUILD)"

      - name: Test
        run: cargo test --workspace

      - name: Build the universal app
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/bundle.sh --universal --version "$VERSION" --build "$BUILD"
          lipo -info "target/bundle/$APP.app/Contents/MacOS/worktree-manager"

      # notarytool wants the App Store Connect key as a file, so the secret has
      # to land on disk. RUNNER_TEMP dies with the runner, and the last step
      # removes it regardless of how the job ends.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_API_KEY_P8 is not set"
            exit 1
          fi
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is not set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          certificate="$RUNNER_TEMP/certificate.p12"

          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application.*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::the certificate holds no Developer ID Application identity — wrong export?"
            exit 1
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"

      # One binary and a couple of resources, so there is nothing nested to
      # sign first. Hardened runtime and a secure timestamp are what
      # notarisation requires; the app asks for no entitlements.
      - name: Sign the app
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" "target/bundle/$APP.app"
          codesign --verify --deep --strict --verbose=2 "target/bundle/$APP.app"

      # Assets are named without spaces: GitHub rewrites those in download
      # URLs, and the updater's manifest has to point at something that
      # resolves.
      - name: Notarise and staple the app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p dist
          zip="dist/Worktree-Manager-$VERSION.zip"
          ditto -c -k --keepParent "target/bundle/$APP.app" "$zip"
          xcrun notarytool submit "$zip" \
            --key "$RUNNER_TEMP/apple-api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "target/bundle/$APP.app"
          # Re-zip: the ticket is stapled into the bundle, and the zip is what
          # the updater installs, so it has to carry the stapled copy. Without
          # this an update would land an app that has to phone home the first
          # time it is opened, and fails if the machine is offline.
          rm -f "$zip"
          ditto -c -k --keepParent "target/bundle/$APP.app" "$zip"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Build, sign, notarise and staple the disk image
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          staging="$RUNNER_TEMP/dmg"
          rm -rf "$staging" && mkdir -p "$staging"
          cp -R "target/bundle/$APP.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          dmg="dist/Worktree-Manager-$VERSION.dmg"
          hdiutil create -volname "$APP" -srcfolder "$staging" -ov -format ULFO "$dmg"
          # A signed disk image gets its own ticket stapled, so mounting it
          # works offline; an unsigned one makes Gatekeeper phone home.
          codesign --force --timestamp --sign "$IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/apple-api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      # What the in-app updater reads (see crates/wtm-core/src/update.rs).
      # `releases/latest/download/…` always resolves to the newest release that
      # is not a prerelease, and `releases/download/beta/…` to whatever the
      # `beta` tag currently points at — so an installed copy needs no GitHub
      # API call and no token, and a beta cannot reach the stable channel.
      - name: Write the update manifest
        run: |
          if [ "$CHANNEL" = stable ]; then
            BASE="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          else
            BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/beta"
          fi
          export BASE
          python3 - <<'PY'
          import hashlib, json, os, pathlib, datetime
          zip_path = pathlib.Path(os.environ["ZIP"])
          manifest = {
              "version": os.environ["VERSION"],
              "channel": os.environ["CHANNEL"],
              "url": f"{os.environ['BASE']}/{zip_path.name}",
              "sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "minimumSystemVersion": "13.0",
              "commit": os.environ["GITHUB_SHA"],
              "publishedAt": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          pathlib.Path("dist/appcast.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      # What a downloader's Mac will check, checked here instead.
      - name: Verify the signature and the tickets
        run: |
          app="target/bundle/$APP.app"

          signature=$(codesign --display --verbose=4 "$app" 2>&1)
          echo "$signature" | grep -E "Authority|TeamIdentifier|flags="
          if ! echo "$signature" | grep -q "Authority=Developer ID Application"; then
            echo "::error::not signed with a Developer ID Application certificate"
            exit 1
          fi
          if ! echo "$signature" | grep -q "flags=.*runtime"; then
            echo "::error::hardened runtime is not enabled"
            exit 1
          fi

          xcrun stapler validate "$app"
          xcrun stapler validate "$DMG"

          # What Gatekeeper actually does when someone runs the app they
          # dragged out of that disk image.
          assessment=$(spctl --assess --type exec -vv "$app" 2>&1)
          echo "$assessment"
          if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Gatekeeper does not see a notarised Developer ID app"
            exit 1
          fi

          # The updater refuses a download whose hash disagrees, so a mismatch
          # here is a release that silently never updates anyone.
          expected=$(python3 -c "import json;print(json.load(open('dist/appcast.json'))['sha256'])")
          actual=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "::error::appcast.json sha256 does not match $ZIP"
            exit 1
          fi

      # The DMG is what a person downloads; the zip and appcast.json are what
      # installed copies update from, and they have to live in the same release
      # for the channel's download URL to resolve them.
      #
      # A beta is published as a prerelease, which is what keeps the two
      # channels apart: `releases/latest` skips prereleases, so nothing here
      # can reach someone on stable. The stable release keeps its own tag and
      # is never touched by a beta run.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          if [ "$CHANNEL" = stable ]; then
            # Recreate the rolling release so its tag always points at this commit.
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" \
              --title "$APP v${VERSION} (${SHORT_SHA})" \
              --notes "Automated build of \`${GITHUB_SHA}\` from \`main\`. Signed and notarised universal macOS build — double-click to open. Installed copies update themselves from here." \
              "$DMG" "$ZIP" dist/appcast.json
          else
            # Point the tag at this commit when it is not already there — a
            # dispatched beta has no tag push behind it. A tag written with
            # GITHUB_TOKEN starts no further workflow run.
            at=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
            if [ "$at" != "$GITHUB_SHA" ]; then
              git tag -f "$TAG" "$GITHUB_SHA"
              git push --force origin "refs/tags/$TAG"
            fi
            # Delete only the release. The tag stays where it is, so nothing
            # here can move what `releases/latest` resolves to.
            gh release delete "$TAG" --yes || true
            gh release create "$TAG" \
              --prerelease --latest=false \
              --title "$APP v${VERSION} (beta, ${SHORT_SHA})" \
              --notes "Beta build of \`${GITHUB_SHA}\`. Signed and notarised, and ahead of the stable release. Copies set to the beta channel in Settings update themselves from here." \
              "$DMG" "$ZIP" dist/appcast.json
          fi

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple-api-key.p8" "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
