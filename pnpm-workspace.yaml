# pnpm settings. From pnpm 11 on, only auth/registry config may live in .npmrc
# and the `pnpm` field in package.json is ignored — every other setting belongs
# here (this file is read even though the repo is not a workspace).

# Packages permitted to run install/postinstall scripts. Anything absent is
# blocked by default, so a new dependency that needs a build must be added here.
# Replaces pnpm 10's `pnpm.onlyBuiltDependencies` in package.json.
#
# esbuild fetches its platform binary in a postinstall.
# electron is listed for parity, but note its npm package ships no postinstall
# here — the root `postinstall` script runs its install.js by hand (see CLAUDE.md).
allowBuilds:
  electron: true
  esbuild: true
  # Pulled in transitively by electron-builder for Squirrel.Windows targets.
  # This app packages macOS only (`pnpm dist` → --mac), so its build script is
  # dead weight. pnpm 10 blocked it too; false keeps that behaviour explicit.
  # Flip to true if a Windows target is ever added.
  electron-winstaller: false

# Security overrides. Every entry below pins a *transitive* dependency forward
# to the first patched release for a GitHub/Dependabot advisory — the direct
# dependency that pulls it in still declares a range that resolves to the
# vulnerable version, so plain `pnpm update` can't reach the fix. Each key is
# scoped to the affected version line (`<pkg>@<vulnerable range>`) so unrelated
# majors of the same package resolve normally, and every bump is patch-level.
#
# Drop an entry once the parent dependency has moved past it on its own:
# `pnpm why <pkg>` shows the parents, and `pnpm audit` must stay clean after.
overrides:
  # GHSA-r292-9mhp-454m — uncatchable stack-overflow DoS on crafted long paths.
  # Via electron-builder (app-builder-lib, node-gyp).
  "tar@<7.5.21": "^7.5.21"
  # GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895 — OOM DoS via unbounded brace
  # expansion. Three major lines are in the tree via minimatch/glob under
  # electron-builder, so each is pinned to its own patched release.
  "brace-expansion@<1.1.18": "^1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "^2.1.4"
  "brace-expansion@>=4.0.0 <5.0.9": "^5.0.9"
  # GHSA-8xcm-r25x-g524, GHSA-m8rv-5g2x-5cg5, GHSA-v3r7-h72x-cjcm — response
  # desync, CRLF injection, cookie attribute injection. Via node-gyp.
  "undici@>=6.0.0 <6.28.0": "^6.28.0"
  # GHSA-7p8r-x3mc-p8w7 (backslash authority introducer), GHSA-5jgf-p345-68v8
  # and GHSA-jqff-g426-hqxp (host confusion via skipped IDN canonicalization /
  # percent-encoded scheme), GHSA-f65p-4m7j-42xc and GHSA-fph4-wmhf-6fwf (SSRF
  # via IPv6 normalization / repeated hostname percent-decoding).
  # Via ajv, which electron-store bundles into the packaged main process.
  "fast-uri@>=3.0.0 <3.1.6": "^3.1.6"
  # GHSA-5p4m-2wfm-xmqj — quadratic CPU consumption resolving !!omap.
  # Via electron-builder's builder-util.
  "js-yaml@>=4.0.0 <4.3.1": "^4.3.1"
  # GHSA-2v37-7h3g-55p8 — custom generators loop indefinitely when size is 0.
  # Via vitest (through @testing-library/jest-dom's peer).
  "nanoid@<3.3.18": "^3.3.18"
  # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g — unbounded query cache (OOM)
  # and prototype write via untrusted custom stats. Via @babel/core under
  # @vitejs/plugin-react.
  "browserslist@<4.28.7": "^4.28.7"
  # GHSA-6gmq-8vp8-gcm6 — XML fragment injection via an invalid
  # EntityReference name during serialization. Via @electron/osx-sign under
  # electron-builder.
  "@xmldom/xmldom@>=0.7.0 <0.8.15": "^0.8.15"
