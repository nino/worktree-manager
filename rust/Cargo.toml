[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
wtm-core = { path = "crates/wtm-core" }
wtm-platform = { path = "crates/wtm-platform" }
wtm-macos = { path = "crates/wtm-macos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "sync", "time", "macros"] }
notify = "8"
directories = "6"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
regex = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
